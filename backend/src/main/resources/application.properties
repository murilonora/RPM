spring.application.name=rpm-backend
server.port=8080

# Banco de dados (MySQL)
# A senha vem da variavel de ambiente DB_PASSWORD (configure no Run Configuration do IntelliJ).
# O usuario vem de DB_USER; se nao existir, usa root.
spring.datasource.url=jdbc:mysql://localhost:3306/sitemusica
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# update: cria e atualiza as tabelas a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
# mostra no console o SQL executado
spring.jpa.show-sql=true
